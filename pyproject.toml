[project]
name = "brainstorm"
version = "0.1.0"
description = "An agent that helps you to learn anything on your computer."
readme = "README.md"
authors = [
    { name = "MahirHamiAbrar" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langgraph>=1.2.20",
    "loguru>=0.7.3",
    "orjson>=3.13.0",
    "pydantic>=2.14.0",
    "selectolax>=1.0.0",
]

[project.scripts]
brainstorm = "brainstorm:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["brainstorm", "brainstorm_llm"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
pythonVersion = "3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = ["-q"]
markers = [
    "integration: tests that call live provider APIs (requires RUN_INTEGRATION=1 and API keys)",
]

[tool.taskipy.tasks]
test = { cmd = "uv run -m pytest", help = "runs all unit tests" }
test-integration = { cmd = "uv run -m pytest -m integration", help = "runs live provider tests" }
prices = { cmd = "uv run python scripts/refresh_prices.py", help = "refreshes model price caches" }
ui = { cmd = "uv run -m brainstorm_ui.app", help = "opens the ui window" }

[dependency-groups]
brainstorm-ui = [
    "pyqt6>=6.12.0",
]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.2.0",
    "pyright>=1.1.400",
    "taskipy>=1.14.1",
]
